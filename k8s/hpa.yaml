apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mi-lab
  labels:
    app.kubernetes.io/name: mi-lab
    app.kubernetes.io/part-of: mi-lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mi-lab
  minReplicas: 1
  maxReplicas: 5
  metrics:
    # Utilization is measured against the container's CPU request (50m in
    # deployment.yaml), so a new pod is added at about 35m average per pod.
    # Memory is not used: a Node process rarely gives it back, so it would
    # never scale down.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
